[project]
name = "kayden"
version = "0.0.0"
description = "A modular AI agent application: a runtime and four swappable modules (Core, Memory, Tools, Frontend)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "K5031"}]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx2>=2.12",
    "jsonschema>=4.26.0",
    "openai>=3.41.0",
    "textual>=8.2.8",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kayden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

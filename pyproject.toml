[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kayden"
version = "0.1.0"
description = "A modular desktop AI assistant with swappable models, memory, actions, tools, and interfaces."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "K5031" }]
keywords = ["ai", "assistant", "agents", "llm", "tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "PyJWT[crypto]",
    "requests",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["build", "pytest", "twine"]
local = ["llama-cpp-python[server]"]
voice-input = [
    "numpy",
    "openai-whisper",
    "PyAudio",
    "SpeechRecognition",
]
voice-dictation = ["faster-whisper", "numpy", "PyAudio"]
voice-output = ["kokoro", "sounddevice"]
qt = ["PySide6>=6.8"]
all = [
    "faster-whisper",
    "kokoro",
    "llama-cpp-python[server]",
    "numpy",
    "openai-whisper",
    "PySide6>=6.8",
    "PyAudio",
    "SpeechRecognition",
    "sounddevice",
    "torch",
]

[project.scripts]
kayden = "kayden.cli:main"

[project.urls]
Homepage = "https://github.com/K5031/Kayden"
Repository = "https://github.com/K5031/Kayden.git"
Issues = "https://github.com/K5031/Kayden/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
"kayden.resources" = ["*.toml", "*.txt", "icons/*.png"]
"kayden.modules.frontend.tauri" = ["module.toml"]
"kayden.modules.frontend.qt" = ["module.toml", "*.qml"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["venv*", "scripts*", "venv.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

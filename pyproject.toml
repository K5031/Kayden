[project]
name = "kayden"
version = "0.0.0"
description = "A modular AI agent application: a runtime and four swappable modules (Core, Memory, Tools, Frontend)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "K5031"}]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "httpx2>=2.12",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "openai>=3.41.0",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
]

[project.scripts]
kayden = "kayden.__main__:main"

# Installed modules, listed in every frontend's settings. A user-made module registers the
# same way in its own package (docs/development.md).
[project.entry-points."kayden.cores"]
anthropic = "kayden.core.anthropic:factory"
deepseek = "kayden.core.openai_compat:deepseek_factory"
openai = "kayden.core.openai_compat:openai_factory"

[project.entry-points."kayden.memories"]
sqlite = "kayden.memory.sqlite:factory"

[project.entry-points."kayden.tools"]
shell-files = "kayden.tools.shell_files:factory"

[project.entry-points."kayden.frontends"]
tui = "kayden.frontends.tui:factory"
desktop = "kayden.frontends.desktop:factory"

[project.optional-dependencies]
desktop = [
    "pyside6-essentials>=6.12.0",
    "qasync>=0.28.0",
]

[dependency-groups]
dev = [
    "kayden[desktop]",
    "psutil>=7.2.2",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kayden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

# Desktop bundles (`briefcase build`); see docs/development.md.
[tool.briefcase]
project_name = "Kayden"
bundle = "io.github.k5031"
version = "0.0.0"
url = "https://github.com/K5031/Kayden"
author = "K5031"

[tool.briefcase.app.kayden-desktop]
formal_name = "Kayden"
description = "An AI agent that works for you on your computer."
sources = ["src/kayden", "src/kayden_desktop"]
requires = [
    "anthropic>=2.3.0",
    "httpx2>=2.12",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "openai>=3.41.0",
    "pyside6-essentials>=6.12.0",
    "qasync>=0.28.0",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
]

[tool.briefcase.app.kayden-desktop.linux.flatpak]
finish_arg."talk-name=org.freedesktop.secrets" = true

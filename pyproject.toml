[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "k"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llama-cpp-python[server]",
    "openai-whisper",
    "SpeechRecognition",
    "sounddevice",
    "PyAudio",
    "numpy",
    "sentence-transformers",
    "chromadb",
    "requests",
    "pyyaml",
    "openai",
    "kokoro",
]

[project.scripts]
k = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main", "controller", "interfaces", "registry", "config"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["venv*", "scripts*", "venv.*"]

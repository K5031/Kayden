[project]
name = "kadence"
version = "0.0.0"
description = "A modular AI agent application: a runtime and four swappable modules (Core, Memory, Tools, Frontend)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "K5031"}]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "ddgs>=9.16.1",
    "httpx2>=2.12",
    "jsonschema>=4.26.0",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "openai>=3.41.0",
    "openpyxl>=3.1.5",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "pyyaml>=6.0.3",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    "trafilatura>=2.3.1",
]

[project.scripts]
kadence = "kadence.__main__:main"
kd = "kadence.__main__:main"  # the same, shorter
kadence-desktop = "kadence.window:main"  # the desktop app (needs the desktop extra)

# Installed modules, listed in every frontend's settings. A user-made module registers the
# same way in its own package (docs/development.md).
[project.entry-points."kadence.cores"]
anthropic = "kadence.core.anthropic:factory"
deepseek = "kadence.core.openai_compat:deepseek_factory"
openai = "kadence.core.openai_compat:openai_factory"

[project.entry-points."kadence.memories"]
sqlite = "kadence.memory.sqlite:factory"
files = "kadence.memory.files:factory"

[project.entry-points."kadence.tools"]
shell-files = "kadence.tools.shell_files:factory"

[project.entry-points."kadence.frontends"]
tui = "kadence.frontends.tui:factory"
desktop = "kadence.frontends.desktop:factory"

[project.optional-dependencies]
desktop = [
    "numpy>=2.5.4",
    "pygments>=2.21",
    "pyside6-addons>=6.12.0",
    "pyside6-essentials>=6.12.0",
    "qasync>=0.28.0",
    "sherpa-onnx>=1.13,<2",
    "sherpa-onnx-core>=1.13,<2",  # the libraries; uv does not see sherpa-onnx requires it
]

[dependency-groups]
dev = [
    "kadence[desktop]",
    "psutil>=7.2.2",
    "pytest",
    "pytest-asyncio",
    "pytest-xdist>=3.8.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kadence"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-n auto"  # parallel (pytest-xdist); -n 0 runs in one process

[tool.ruff]
line-length = 100

# Desktop bundles (`briefcase build`); see docs/development.md.
[tool.briefcase]
project_name = "Kadence"
bundle = "io.github.k5031"
version = "0.0.0"
url = "https://github.com/K5031/Kadence"
author = "K5031"

[tool.briefcase.app.kadence-desktop]
formal_name = "Kadence"
description = "An AI agent that works for you on your computer."
sources = ["src/kadence_desktop"]
# Kadence itself, installed with its metadata: its modules are found through entry points.
requires = [".[desktop]"]

[tool.briefcase.app.kadence-desktop.linux.flatpak]
finish_arg."talk-name=org.freedesktop.secrets" = true

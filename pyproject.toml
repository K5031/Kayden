[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "k"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
local = ["llama-cpp-python[server]"]
memory = [
    "chromadb",
    "llama-cpp-python[server]",
    "sentence-transformers",
    "torch",
]
voice-input = [
    "numpy",
    "openai-whisper",
    "PyAudio",
    "SpeechRecognition",
    "sounddevice",
]
voice-output = ["kokoro", "sounddevice"]
all = [
    "chromadb",
    "kokoro",
    "llama-cpp-python[server]",
    "numpy",
    "openai-whisper",
    "PyAudio",
    "sentence-transformers",
    "SpeechRecognition",
    "sounddevice",
    "torch",
]

[project.scripts]
k = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["audio", "config", "events", "interfaces", "klogger", "main", "registry", "tool_runtime", "turns", "utils"]
include-package-data = true

[tool.setuptools.package-data]
k_resources = ["*.toml", "*.txt"]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["venv*", "scripts*", "venv.*"]
